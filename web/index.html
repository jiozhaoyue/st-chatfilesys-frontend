<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ChatFilesys web 工作台——与酒馆插件同一套 UI 的聊天记录查看 / 编辑 / 转换页面：分支管理、结构树图、版本管理、阅读视图、全局搜索。零构建、零外部请求。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b3a55'/%3E%3Cpath d='M9 8h10l4 4v12H9z' fill='none' stroke='%239fc1ff' stroke-width='2'/%3E%3Cpath d='M12 15h8M12 19h8' stroke='%239fc1ff' stroke-width='2'/%3E%3C/svg%3E">
  <title>ChatFilesys · 工作台（web 模式）</title>
  <!--
    web 模式 —— 三形态同构（L1-MR-6）：本页不含业务节点，只有入口 chrome
    （档位徽章 / 家族选择 / 导入）；全部业务 UI 出自插件 ui/popup.js#createPopupContent
    （与酒馆弹窗同一模板源），动作出自 ui/workbench.js（宿主无关控制器）。
    零构建、零 CDN、零外部请求。
  -->
  <!--
    Font Awesome 走本地副本（pack-transfer 同款做法，禁 CDN；许可随目录分发）。
    弹窗 HTML 里的 fa-* 图标由酒馆宿主提供，web 页自己补上。
  -->
  <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../public/scripts/extensions/third-party/chatfilesys/style.css">
  <link rel="stylesheet" href="./web.css">
  <style>
    html, body { margin: 0; min-height: 100%; background: #141417; color: #d6d6dd; }
  </style>
</head>
<body>
  <div class="cfsysw-app" id="app">
    <header class="cfsysw-header">
      <div>
        <h1 class="cfsysw-title">ChatFilesys · 工作台 <span class="cfsysw-badge">web 模式</span></h1>
        <div class="cfsysw-sub">与酒馆插件同一套 core/ui —— 数据源：<span id="cfsysw-tier">检测中…</span>
          · <span id="cfsysw-libcount">—</span></div>
      </div>
      <div class="cfsysw-header-actions">
        <select class="text_pole" id="cfsysw-family" title="选择要打开的家族（= 插件里的「当前聊天」）"></select>
        <select class="text_pole" id="cfsysw-floor" title="选择楼层（= 插件里消息旁的版本按钮入口）" disabled></select>
        <button class="cfsysw-btn" id="cfsysw-versions" disabled
          title="管理该层的版本（切换/删除/重排/编辑）——与插件的消息旁版本弹窗同一份 UI">版本管理</button>
        <button class="cfsysw-btn" id="cfsysw-reader-btn"
          title="整篇阅读当前分支的完整对话（点任意一条管理该层版本）"><i class="fa-solid fa-book-open"></i> 阅读视图</button>
        <button class="cfsysw-btn" id="cfsysw-sample">载入示例</button>
        <label class="cfsysw-btn cfsysw-filebtn">导入 .jsonl
          <input type="file" id="cfsysw-file" accept=".jsonl,application/json" multiple hidden>
        </label>
        <button class="cfsysw-btn cfsysw-btn-danger" id="cfsysw-delete" disabled
          title="从当前存储档删除打开的家族（确认对话框；idb 档可重新导入源文件重建）"><i class="fa-solid fa-trash"></i> 删除家族</button>
        <button class="cfsysw-btn" id="cfsysw-rename" disabled
          title="给打开的家族改个显示名（不影响源文件名与聊天键）"><i class="fa-solid fa-pencil"></i> 改名</button>
      </div>
    </header>

    <div class="cfsysw-subrow">
      <div class="cfsysw-search-host" id="cfsysw-search-host"></div>
      <div class="cfsysw-statsrow" id="cfsysw-stats" title="当前家族的统计概览（全家族口径 + 活跃分支口径）"></div>
    </div>

    <main class="cfsysw-main-host">
      <div class="cfsysw-reader-host" id="cfsysw-reader-host"></div>
      <div class="cfsysw-popup-host" id="cfsysw-popup-host"></div>
    </main>
  </div>

  <!--
    经典脚本（**非 module**）：只为 file:// 双击形态给一句「该怎么办」的说明。
    模块脚本在 file:// 下必然被 CORS 拒 ⇒ 没有它就只剩白屏。HTTP(S) 形态下它立即返回、
    一个字节都不动（否则就成了第二份工作台 UI，违反单一模板源铁律）。
  -->
  <script src="./file-protocol-notice.js"></script>
  <script type="module" src="./app.js?v=28"></script>
</body>
</html>
