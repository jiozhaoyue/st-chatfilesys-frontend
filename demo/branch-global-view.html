<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演示② · 总体分支视角（树状全局图）— ChatBranch</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0d1117; --bg2:#161b22; --bg3:#1c2129; --line:#30363d;
    --fg:#c9d1d9; --dim:#8b949e; --faint:#484f58;
    --blue:#58a6ff; --orange:#f0883e; --purple:#a371f7; --green:#3fb950; --yellow:#d29922; --red:#f85149;
  }
  body { background:var(--bg); color:var(--fg); font-family:'Noto Sans SC','Segoe UI',system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  .topbar { display:flex; align-items:center; gap:12px; padding:8px 16px; background:#0a0d12; border-bottom:1px solid var(--line); flex-shrink:0; }
  .topbar .t { font-size:14px; font-weight:600; color:#e6edf3; }
  .topbar .s { font-size:11.5px; color:var(--faint); }
  .spacer { flex:1; }
  .topbtn { background:var(--bg3); border:1px solid var(--line); color:var(--dim); font-size:12px; padding:5px 12px; border-radius:6px; cursor:pointer; }
  .topbtn:hover { color:var(--fg); border-color:var(--dim); }

  .layout { flex:1; display:flex; min-height:0; }
  .left { flex:1.35; display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--line); }
  .left-scroll { flex:1; overflow-y:auto; padding:18px 22px 10px; }
  .right { width:440px; flex-shrink:0; display:flex; flex-direction:column; min-height:0; }
  .rp { border-bottom:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .rp .ph { padding:8px 14px; font-size:12.5px; color:#e6edf3; background:var(--bg3); display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .rp .ph .sub { color:var(--faint); font-size:10.5px; margin-left:auto; }
  .rp .pb { padding:12px 14px; overflow-y:auto; }

  /* floors */
  .floorrow { display:flex; align-items:stretch; margin-bottom:8px; }
  .fno { width:52px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--faint); font-size:11px; border-right:1px solid #21262d; padding:4px 0; }
  .fno .fk { color:var(--yellow); font-size:13px; }
  .groups { display:flex; gap:10px; padding:4px 10px; flex:1; flex-wrap:wrap; }
  .sg { background:var(--bg3); border:1px solid var(--line); border-left:3px solid var(--green); border-radius:8px; padding:8px 10px; min-width:170px; flex:1; max-width:300px; position:relative; }
  .sg.owned { border-left-color:var(--blue); }
  .sg.idle { opacity:.45; }
  .sgh { display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:6px; }
  .sgh .gn { font-size:10.5px; font-weight:600; color:var(--dim); }
  .sgh .own { font-size:9.5px; padding:1px 6px; border-radius:99px; border:1px solid var(--line); color:var(--faint); }
  .sgh .own.shared { color:var(--green); border-color:rgba(63,185,80,.4); }
  .sgact { position:absolute; top:4px; right:6px; display:flex; gap:1px; opacity:0; transition:opacity .15s; }
  .sg:hover .sgact { opacity:1; }
  .sgact button { background:#0d1117cc; border:1px solid var(--line); border-radius:4px; color:var(--dim); font-size:10.5px; padding:1px 5px; cursor:pointer; }
  .sgact button:hover { color:var(--fg); border-color:var(--dim); }
  .sgact button.del:hover { color:var(--red); border-color:var(--red); }
  .msg { background:var(--bg); border:1px solid #21262d; border-radius:6px; padding:6px 9px; font-size:12px; margin-bottom:4px; display:flex; gap:8px; align-items:baseline; cursor:pointer; }
  .msg:hover { border-color:var(--blue); }
  .msg.cur-v { border-color:rgba(88,166,255,.55); background:#111a24; }
  .msg .who { font-weight:600; flex-shrink:0; font-size:10.5px; }
  .msg .who.u { color:var(--orange); } .msg .who.a { color:var(--purple); }
  .msg .tx { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msg .vt { margin-left:auto; font-size:9.5px; color:var(--faint); flex-shrink:0; }
  .swbar { display:flex; align-items:center; gap:6px; margin-top:5px; font-size:10.5px; color:var(--dim); }
  .swbar button { background:none; border:1px solid var(--line); border-radius:4px; color:var(--dim); cursor:pointer; font-size:10px; padding:0 6px; }
  .swbar button:hover { color:var(--blue); border-color:var(--blue); }
  .forkrow { margin-top:4px; width:100%; text-align:center; font-size:10.5px; color:var(--faint); background:none; border:1px dashed #21262d; border-radius:6px; padding:2px 0; cursor:pointer; }
  .forkrow:hover { color:var(--yellow); border-color:var(--yellow); }

  /* input */
  .inputbar { flex-shrink:0; border-top:1px solid var(--line); background:#0a0d12; padding:12px 22px; display:flex; gap:10px; align-items:flex-end; }
  textarea#inp { flex:1; background:var(--bg2); border:1px solid var(--line); color:var(--fg); border-radius:10px; padding:10px 12px; font-size:13px; font-family:inherit; resize:none; height:42px; }
  textarea#inp:focus { outline:none; border-color:var(--dim); }
  button#send { background:#1f6feb; border:none; color:#fff; border-radius:10px; padding:0 20px; height:42px; font-size:13px; cursor:pointer; }
  button#send:hover { filter:brightness(1.15); }

  /* tree */
  .brow { display:flex; align-items:center; gap:9px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; margin-bottom:7px; cursor:pointer; background:var(--bg3); }
  .brow:hover { border-color:var(--dim); }
  .brow.cur { border-color:var(--blue); background:#111a24; }
  .bdot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .bname { font-size:12.5px; color:#e6edf3; }
  .bact { display:flex; gap:2px; }
  .bact button { background:none; border:none; color:var(--faint); cursor:pointer; font-size:11.5px; padding:2px; }
  .bact button:hover { color:var(--blue); }
  .bact button.del:hover { color:var(--red); }
  .bmeta { margin-left:auto; font-size:10.5px; color:var(--faint); text-align:right; }

  /* file view */
  .ftabs { display:flex; gap:2px; }
  .ftab { background:none; border:none; color:var(--dim); font-size:11.5px; padding:3px 9px; cursor:pointer; border-radius:6px 6px 0 0; }
  .ftab.on { color:var(--blue); background:var(--bg); }
  pre.code { background:var(--bg); border-radius:8px; padding:12px; font-size:11px; line-height:1.7; overflow:auto; max-height:240px; color:var(--fg); white-space:pre-wrap; }
  pre.code .ln { color:var(--faint); user-select:none; margin-right:10px; }
  pre.code .k { color:var(--blue); } pre.code .s { color:#a5d6ff; } pre.code .n { color:#f2cc60; } pre.code .c { color:var(--faint); font-style:italic; }

  #explain { font-size:12px; color:var(--dim); line-height:1.7; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:10.5px; color:var(--dim); padding:8px 22px; border-top:1px solid var(--line); background:#0a0d12; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
  .editing { width:100%; }
  .editing textarea { width:100%; background:var(--bg); border:1px solid var(--blue); color:var(--fg); border-radius:6px; padding:6px; font-size:12px; font-family:inherit; resize:vertical; min-height:52px; }
  .editing .erow { display:flex; gap:5px; margin-top:5px; justify-content:flex-end; }
  .editing .erow button { background:var(--bg3); border:1px solid var(--line); color:var(--dim); font-size:10.5px; border-radius:5px; padding:2px 9px; cursor:pointer; }
  .editing .erow button.ok { color:var(--green); border-color:var(--green); }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#1f6feb; color:#fff; font-size:12.5px; padding:8px 18px; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99; max-width:70vw; }
  #toast.show { opacity:1; }
</style>
</head>
<body>

  <div class="topbar">
    <span class="t">总体分支视角 · 聊天家族「Seraphina」</span>
    <span class="s">操作方式与 ST 一致：输入框发送、消息上悬浮操作、组上 swipe 箭头</span>
    <div class="spacer"></div>
    <a href="st-user-view.html" style="font-size:12px">→ 演示①：ST 用户视角</a>
  </div>

  <div class="layout">
    <div class="left">
      <div class="left-scroll" id="building"></div>
      <div class="inputbar">
        <textarea id="inp" placeholder="继续聊天——以「我」的身份发送（发送后 Seraphina 自动回复）…"></textarea>
        <button id="send">发送</button>
      </div>
      <div class="legend">
        <span><i style="background:var(--green)"></i>共享楼层</span>
        <span><i style="background:var(--blue)"></i>当前分支私有</span>
        <span><i style="background:var(--faint)"></i>其他分支（已折叠）</span>
        <span style="color:var(--yellow)">⎇ 分叉点（同层 &gt;1 组）</span>
        <span>消息点击 = 切 swipe 变体</span>
      </div>
    </div>

    <div class="right">
      <div class="rp" style="flex-shrink:0">
        <div class="ph">分支树<span class="sub" id="curName"></span></div>
        <div class="pb" id="branchTree"></div>
      </div>
      <div class="rp" style="flex-shrink:0">
        <div class="ph">落盘视图 · chat1.jsonl
          <span class="ftabs" style="margin-left:auto">
            <button class="ftab on" id="ftMain" onclick="fTab('main')">主数组</button>
            <button class="ftab" id="ftMeta" onclick="fTab('meta')">branches</button>
            <button class="ftab" id="ftExport" onclick="fTab('export')">导出</button>
          </span>
        </div>
        <div class="pb"><pre class="code" id="fileView"></pre></div>
      </div>
      <div class="rp" style="flex:1">
        <div class="ph">本次操作对文件的影响</div>
        <div class="pb" id="explain"></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script src="branches-core.js"></script>
<script>
  const el = id => document.getElementById(id);
  const D = window.FloorDemo;
  let aiReplyIdx = 0;
  let fileTabMode = 'main';

  D.onToast(msg => { const t = el('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); });
  D.onExplain(html => { el('explain').innerHTML = html; });

  /* ---------- 楼层全局图渲染（ST 式操作内嵌） ---------- */
  function render() {
    const cur = D.activeBranch();
    el('curName').textContent = '当前：' + cur.name;
    let html = '';
    for (const f of D.state.floors) {
      const isFork = f.gids.length > 1;
      html += `<div class="floorrow"><div class="fno"><span class="fk">${isFork ? '⎇' : ''}</span>F${f.number}</div><div class="groups">`;
      for (const gid of f.gids) {
        const g = D.group(gid);
        const onActive = Object.values(cur.path).includes(gid);
        const shared = g.owner === null;
        const cls = `sg ${onActive ? (shared ? '' : 'owned') : 'idle'}`;
        const ownTag = shared ? '<span class="own shared">共享</span>' : `<span class="own">${escapeHtml(D.branch(g.owner)?.name || '私有')}</span>`;
        html += `<div class="${cls}" data-sg="${gid}">
          <div class="sgh"><span class="gn">${gid}${g.variants.length > 1 ? ` · ${g.variants.length}变体` : ''}</span>${ownTag}</div>
          <div class="sgact">
            <button title="编辑当前变体" onclick="editG('${gid}',${g.active},event)">✎</button>
            <button class="del" title="删除该组（全局）" onclick="delG('${gid}',event)">🗑</button>
          </div>`;
        g.variants.forEach((v, vi) => {
          const act = onActive && g.active === vi;
          html += `<div class="msg ${act ? 'cur-v' : ''}" onclick="clickVariant('${gid}',${vi})" title="${onActive ? '点击切换 swipe 变体' : '属于其他分支（已折叠进 metadata）'}">
            <span class="who ${v.isUser ? 'u' : 'a'}">${v.name}</span><span class="tx">${escapeHtml(v.mes)}</span>${g.variants.length > 1 ? `<span class="vt">v${vi + 1}</span>` : ''}</div>`;
        });
        if (onActive && g.variants.length > 1) {
          html += `<div class="swbar">
            <button onclick="swipe('${gid}',-1,event)">◀</button><span>${g.active + 1}/${g.variants.length}</span>
            <button onclick="swipe('${gid}',1,event)">▶</button>
            <button onclick="addSwipe('${gid}',event)" title="添加变体">＋</button></div>`;
        } else if (onActive) {
          html += `<div class="swbar"><button onclick="addSwipe('${gid}',event)">＋ 添加 swipe 变体</button></div>`;
        }
        html += `<button class="forkrow" onclick="forkAt(${f.number},event)">⎇ 在第 ${f.number} 层之后分叉</button></div>`;
      }
      html += `</div></div>`;
    }
    el('building').innerHTML = html;
    renderTree();
    renderFile();
  }

  function renderTree() {
    let html = '';
    D.state.branches.forEach(b => {
      const cur = b.id === D.state.activeBranch;
      html += `<div class="brow ${cur ? 'cur' : ''}" onclick="D.switchTo('${b.id}');render()">
        <span class="bdot" style="background:${b.color}"></span>
        <span class="bname">${escapeHtml(b.name)}${b.isDefault ? ' <span style="color:var(--faint);font-size:10px">默认</span>' : ''}</span>
        <span class="bact" onclick="event.stopPropagation()">
          <button title="重命名" onclick="renameB('${b.id}',event)">✎</button>
          ${!b.isDefault ? `<button class="del" title="删除" onclick="delB('${b.id}',event)">🗑</button>` : ''}
        </span>
        <span class="bmeta">${b.forkBase ? '⎇F' + b.forkBase + '后 · ' : ''}${D.branchMsgCount(b)}变体 · 至F${D.branchMaxFloor(b)}</span>
      </div>`;
    });
    el('branchTree').innerHTML = html;
  }

  /* ---------- 操作（stopPropagation 防触发行点击） ---------- */
  function stop(e) { if (e) { e.stopPropagation(); } }
  function send() {
    const v = el('inp').value.trim();
    if (!v) return;
    el('inp').value = '';
    D.addMessage({ who: D.ME, text: v });
    render(); scrollBottom();
    setTimeout(() => {
      D.addMessage({ who: D.AI, text: D.AI_REPLIES[aiReplyIdx++ % D.AI_REPLIES.length] });
      render(); scrollBottom();
    }, 450);
  }
  function scrollBottom() { const s = el('building').parentElement; s.scrollTop = s.scrollHeight; }
  function clickVariant(gid, vi) {
    const cur = D.activeBranch();
    if (!Object.values(cur.path).includes(gid)) {
      const t = el('toast'); t.textContent = '该组属于其他分支（已折叠）——切换到对应分支后操作';
      t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400);
      return;
    }
    D.setVariant(gid, vi); render();
  }
  function swipe(gid, dir, e) { stop(e); const g = D.group(gid); D.setVariant(gid, (g.active + dir + g.variants.length) % g.variants.length); render(); }
  function addSwipe(gid, e) { stop(e); D.addVariant(gid); render(); }
  function forkAt(floor, e) { stop(e); const name = prompt(`在第 ${floor} 层之后分叉——新分支名称：`, `分叉·F${floor}`); if (name) { D.forkAt(floor, name.trim()); render(); } }
  function delG(gid, e) { stop(e); if (confirm('删除该组？（全局生效，后续楼层重编号）')) { D.deleteGroup(gid); render(); } }
  function renameB(id, e) { stop(e); const b = D.branch(id); const n = prompt('重命名分支', b.name); if (n) { D.renameBranch(id, n); render(); } }
  function delB(id, e) { stop(e); if (confirm('删除该分支？其私有楼层将一并移除。')) { D.deleteBranch(id); render(); } }
  function editG(gid, vi, e) {
    stop(e);
    const g = D.group(gid);
    const target = document.querySelector(`.sg[data-sg="${gid}"]`);
    if (!target) return;
    const old = g.variants[vi].mes;
    const editor = document.createElement('div');
    editor.className = 'editing';
    editor.innerHTML = `<textarea>${escapeHtml(old)}</textarea><div class="erow"><button class="cx">✕</button><button class="ok">✓ 保存</button></div>`;
    const firstMsg = target.querySelector('.msg');
    firstMsg.parentNode.insertBefore(editor, firstMsg);
    editor.querySelector('.cx').onclick = ev => { stop(ev); editor.remove(); };
    editor.querySelector('.ok').onclick = ev => { stop(ev); D.editVariant(gid, vi, editor.querySelector('textarea').value); render(); };
  }
  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  /* ---------- 落盘视图 ---------- */
  function fTab(t) {
    fileTabMode = t;
    ['main', 'meta', 'export'].forEach(x => el('ft' + x[0].toUpperCase() + x.slice(1)).classList.toggle('on', x === t));
    renderFile();
  }
  function renderFile() {
    const pre = el('fileView');
    if (fileTabMode === 'main') {
      let html = `<span class="ln">1</span><span class="c">// header（branches 见下一标签）</span>\n`;
      D.activeLines().forEach((L, i) => {
        const o = L.line;
        html += `<span class="ln">${i + 2}</span>{<span class="k">"name"</span>:<span class="s">"${o.name}"</span>,<span class="k">"is_user"</span>:<span class="n">${o.is_user}</span>,<span class="k">"mes"</span>:<span class="s">"${o.mes.replace(/"/g, '\\"')}"</span>` +
          (o.swipes ? `,<span class="k">"swipes"</span>:[…],<span class="k">"swipe_id"</span>:<span class="n">${o.swipe_id}</span>` : '') + `} <span class="c">← F${L.floor}</span>\n`;
      });
      pre.innerHTML = html;
    } else if (fileTabMode === 'meta') {
      const m = D.branchesData();
      pre.innerHTML = `<span class="k">"branches"</span>:\n<span style="color:#c9d1d9">${escapeHtml(JSON.stringify(m, null, 1))}</span>\n<span class="c">// 非活跃分支的组只在这里；活跃分支的组=主线性数组，不重复存。</span>`;
    } else {
      let html = `<span class="c">// 增量导出：纯标准 JSONL（当前分支），vanilla ST 可直接使用。</span>\n`;
      html += `<span class="ln">1</span>{<span class="k">"chat_metadata"</span>:{…}}\n`;
      D.activeLines().forEach((L, i) => {
        html += `<span class="ln">${i + 2}</span>{<span class="k">"name"</span>:<span class="s">"${L.line.name}"</span>,<span class="k">"mes"</span>:<span class="s">"${L.line.mes.replace(/"/g, '\\"')}"</span>,…}\n`;
      });
      pre.innerHTML = html;
    }
  }

  el('send').onclick = send;
  el('inp').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  render();
</script>
</body>
</html>
