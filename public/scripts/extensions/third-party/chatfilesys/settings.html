<div id="chatfilesys-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-header inline-drawer-toggle">
            <b>聊天文件系统（ChatFilesys）</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="chatfilesys-settings-content inline-drawer-content">
            <div class="chatfilesys-settings-status"></div>
            <div class="chatfilesys-btnrow">
                <button class="menu_button" data-action="open-popup"><i class="fa-solid fa-folder-tree"></i> 打开管理面板</button>
                <span class="chatfilesys-entry-hint">入口：此按钮 / 斜杠命令 <code>/cb</code> / 快捷键 Alt+B</span>
            </div>
            <div class="chatfilesys-export-row">
                <label><input type="checkbox" id="chatfilesys-auto-export"> 保存后自动导出</label>
            </div>
            <div class="chatfilesys-export-row">
                <label title="jsonl 仅导出时存在；安装旅程可导入存量聊天并智能合并">
                    <input type="checkbox" id="chatfilesys-pure-db"> 纯数据库模式（实验）
                </label>
            </div>
            <div class="chatfilesys-btnrow">
                <button class="menu_button" data-action="run-import" title="检测存量 jsonl → 指纹合并入库 → 源文件移入回收站（需纯库模式）">
                    <i class="fa-solid fa-box-archive"></i> 导入存量聊天
                </button>
            </div>
            <div id="chatfilesys-storage-badge" class="chatfilesys-btnrow"></div>
        </div>
    </div>
</div>
